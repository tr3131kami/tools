<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>CORS test (temporary)</title>
</head>
<body>
<pre id="out">running...</pre>
<script>
  var out = [];
  function log(s) { out.push(s); document.getElementById('out').textContent = out.join('\n'); }
  function testProject() {
    return fetch('https://api.scratch.mit.edu/projects/1185472700/')
      .then(function (res) {
        log('PROJECT status=' + res.status);
        return res.json();
      })
      .then(function (data) {
        log('PROJECT ok title=' + (data && data.title));
        log('PROJECT stats=' + JSON.stringify(data && data.stats));
      })
      .catch(function (e) { log('PROJECT fetch-error ' + e); });
  }
  function testUserProjects() {
    return fetch('https://api.scratch.mit.edu/users/suzunokana/projects?limit=5&offset=0')
      .then(function (res) {
        log('USERPROJECTS status=' + res.status);
        return res.json();
      })
      .then(function (data) {
        if (Array.isArray(data)) {
          log('USERPROJECTS ok count=' + data.length);
          if (data[0]) {
            log('USERPROJECTS first title=' + data[0].title);
            log('USERPROJECTS first stats=' + JSON.stringify(data[0].stats));
            log('USERPROJECTS first image=' + data[0].image);
          }
        } else {
          log('USERPROJECTS not-array ' + JSON.stringify(data).slice(0, 200));
        }
      })
      .catch(function (e) { log('USERPROJECTS fetch-error ' + e); });
  }
  testProject().then(testUserProjects).then(function () { log('DONE'); });
</script>
</body>
</html>
